services:
  postgres:
    image: postgres:16-alpine
    container_name: praveg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: praveg
    ports:
      - "5432:5432"
    volumes:
      - praveg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d praveg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  praveg_postgres_data:
